services:
  postgres:
    image: postgres:16
    container_name: apidex-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apidex_dev
    ports:
      - "5432:5432"
    volumes:
      - apidex_postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: apidex-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - apidex_qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.26-community
    container_name: apidex-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - apidex_neo4j_data:/data

volumes:
  apidex_postgres_data:
  apidex_qdrant_data:
  apidex_neo4j_data:
